"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Eyebrow
group: Base
status: stable
props:
  type: object
  required:
    - text_color
  properties:
    eyebrow_text:
      type: string
      title: Eyebrow text
      examples:
        - Eyebrow label
    text_color:
      type: string
      title: Text color
      enum:
        - default
        - inverted
        - primary
        - drupal-blue
        - light-purple
        - drupal-dark-blue
      meta:enum:
        default: Dark grey
        inverted: White
        primary: Brand navy
        drupal-dark-blue: Drupal dark blue
        drupal-blue: Drupal blue (only use on navy)
        light-purple: Light purple (only use on navy)
      examples:
        - drupal-dark-blue
