$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Button
group: Base
status: stable
props:
  type: object
  required:
    - variant
  properties:
    variant:
      type: string
      title: Colour
      enum:
        - primary
        - white
        - white-outline
        - light-blue
        - drupal-blue
        - transparent-white
        - transparent-navy
        - navy-link
        - blue-link
      meta:enum:
        primary: Brand navy
        white: White
        white-outline: White with outline
        light-blue: Light blue
        drupal-blue: Drupal blue
        transparent-white: Transparent white
        transparent-navy: Transparent navy
        navy-link: Navy link
        blue-link: Drupal blue link
      examples:
        - primary
    label:
      type: string
      title: Label
      default: "Button label"
      examples:
        - "Try Drupal"
    href:
      type: string
      title: Link
      format: uri-reference
    icon:
      type: string
      title: Icon
      enum:
        - arrow-right
        - arrow-left
        - arrow-down
        - arrow-up-right
        - caret-right
        - caret-left
        - download
        - user-plus
      meta:enum:
        arrow-right: Arrow right
        arrow-left: Arrow left
        arrow-down: Arrow down
        arrow-up-right: Arrow up right
        caret-right: Caret right
        caret-left: Caret left
        download: Download
        user-plus: User plus
      examples:
        - arrow-right
    disabled:
      type: boolean
      title: Disabled
      default: false
      examples:
        - false
        - true
    full_width:
      type: boolean
      title: Full width
      description: Stretch the button to fill its container.
      default: false
      examples:
        - false
        - true
