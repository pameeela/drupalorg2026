"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Featured hero
group: Hero
props:
  type: object
  required:
    - heading
  properties:
    heading:
      type: string
      title: Heading
      examples:
        - "Your headline goes here."
    body:
      type: string
      title: Body text
      pattern: "(.|\\r?\\n)*"
      examples:
        - "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
    background_video:
      $ref: json-schema-definitions://canvas.module/video
      title: Background video
      type: object
    background_color:
      type: string
      title: Background color
      description: Used when no background video is provided.
      enum:
        - dark
        - light-grey
        - light-blue
        - drupal-blue
        - light-blue-gradient
        - dark-blue-gradient
        - darkest-blue
        - character-stream
      meta:enum:
        dark: Navy blue
        light-grey: Light grey
        light-blue: Light blue
        drupal-blue: Drupal blue
        light-blue-gradient: Light blue gradient
        dark-blue-gradient: Dark blue gradient
        darkest-blue: Darkest blue
        character-stream: Character stream
    image:
      $ref: json-schema-definitions://canvas.module/image
      title: Screenshot image
      type: object
      examples:
        - src: ""
          alt: "Drupal CMS screenshot"
          width: 1120
          height: 662

slots:
  actions:
    title: Buttons
