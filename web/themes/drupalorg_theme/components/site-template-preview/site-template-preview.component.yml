$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Site template preview
group: Layout
status: stable
props:
  type: object
  required:
    - mode
    - size
  properties:
    media:
      title: Screenshots
      description: One or more full-page screenshots. First item is the default and is used for browse cards.
      type: array
      items:
        $ref: json-schema-definitions://canvas.module/image
        type: object
      examples:
        - - src: "https://placehold.co/1440x4000/f3f4f6/12285f?text=Home"
            alt: "Full homepage of the example template"
            width: 1440
            height: 4000
          - src: "https://placehold.co/1440x3200/f3f4f6/12285f?text=Features"
            alt: "Features page of the example template"
            width: 1440
            height: 3200
    chrome_url:
      type: string
      title: Browser chrome URL
      description: Shown in the browser chrome address pill.
      examples:
        - "byte.preview.drupal.org"
    mode:
      type: string
      title: Interaction mode
      enum:
        - scroll
        - hover
      meta:enum:
        scroll: Full scroll (detail page)
        hover: Tap to scroll (browse cards)
      default: scroll
      examples:
        - scroll
    size:
      type: string
      title: Viewport height
      enum:
        - detail
        - card
      meta:enum:
        detail: Detail (600px / 300px mobile)
        card: Browse card (450px)
      default: detail
      examples:
        - detail
    show_chrome:
      type: boolean
      title: Show browser chrome
      default: true
      examples:
        - true
    caption:
      type: string
      title: Caption
      examples:
        - "Scroll to explore the full page"

libraryOverrides:
  js:
    site-template-preview.js: { attributes: { type: module } }
