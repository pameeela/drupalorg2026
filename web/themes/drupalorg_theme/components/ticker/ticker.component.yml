"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Ticker
description: A header and an auto-scrolling row of items (e.g. logos) that slows on hover.
group: Layout
props:
  type: object
  required:
    - columns
    - margin_block_start
    - margin_block_end
  properties:
    columns:
      type: string
      title: Columns
      description: Number of items visible across the row on desktop, or "fit" to size each item to its content.
      enum:
        - "3"
        - "4"
        - "5"
        - "6"
        - fit
      meta:enum:
        "3": 3 columns
        "4": 4 columns
        "5": 5 columns
        "6": 6 columns
        fit: Fit to content
      default: "6"
      examples:
        - "6"
    margin_block_start:
      type: string
      title: Margin top
      enum:
        - "0"
        - small
        - default
        - large
      meta:enum:
        "0": None
        small: Small
        default: Default
        large: Large
      examples:
        - "default"
    margin_block_end:
      type: string
      title: Margin bottom
      enum:
        - "0"
        - small
        - default
        - large
      meta:enum:
        "0": None
        small: Small
        default: Default
        large: Large
      examples:
        - "default"
    center_header:
      type: boolean
      title: Center header content
      examples:
        - true
    add_separator:
      type: boolean
      title: Add separator
      description: Show a small Drupal blue circle between each item.
slots:
  header:
    title: Header
    description: Heading shown above the ticker.
  items:
    title: Items
    description: Items to scroll, e.g. Logo cards.
